name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy-api:
    name: Deploy API (Railway)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - name: Install Railway CLI
        run: npm install -g @railway/cli
      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "RAILWAY_TOKEN unset — cannot deploy API."
            echo "Create a token in Railway Account Settings and add GitHub secret RAILWAY_TOKEN."
            exit 1
          fi
          railway up --ci -d -s hazara-server

  deploy-web:
    name: Deploy Web (Firebase)
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Require API_BASE
        env:
          API_BASE: ${{ vars.API_BASE }}
        run: |
          if [ -z "$API_BASE" ]; then
            echo "Set GitHub Actions variable API_BASE to the Railway public HTTPS URL"
            echo "(no trailing slash), e.g. https://hazara-server-production.up.railway.app"
            exit 1
          fi
          echo "API_BASE=$API_BASE"
      - name: Build Flutter Web
        working-directory: frontend/hazara_flutter
        env:
          API_BASE: ${{ vars.API_BASE }}
          PUBLIC_WEB_ORIGIN: ${{ vars.PUBLIC_WEB_ORIGIN }}
        run: |
          flutter pub get
          chmod +x tool/build_web_release.sh tool/stamp_web_build.sh
          API_BASE="$API_BASE" \
          PUBLIC_WEB_ORIGIN="${PUBLIC_WEB_ORIGIN:-https://hazara-lws-260731.web.app}" \
            ./tool/build_web_release.sh
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - name: Deploy Hosting
        working-directory: frontend/hazara_flutter
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "FIREBASE_TOKEN secret missing — skip hosting deploy"
            exit 1
          fi
          if [ -z "$FIREBASE_PROJECT_ID" ]; then
            echo "FIREBASE_PROJECT_ID variable missing — skip hosting deploy"
            exit 1
          fi
          firebase deploy --only hosting:prod \
            --project "$FIREBASE_PROJECT_ID" \
            --token "$FIREBASE_TOKEN" \
            --non-interactive

  smoke:
    name: Post-deploy smoke
    needs: [deploy-api, deploy-web]
    if: always() && needs.deploy-web.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Health checks
        env:
          API_BASE: ${{ vars.API_BASE }}
          WEB_ORIGIN: ${{ vars.PUBLIC_WEB_ORIGIN }}
        run: |
          set -euo pipefail
          if [ -n "${API_BASE:-}" ]; then
            echo "Checking $API_BASE/healthz"
            curl -fsS "$API_BASE/healthz" | tee /tmp/healthz
            echo "Checking $API_BASE/readyz"
            curl -fsS "$API_BASE/readyz" | tee /tmp/readyz
          else
            echo "API_BASE unset — skip API smoke"
          fi
          if [ -n "${WEB_ORIGIN:-}" ]; then
            echo "Checking $WEB_ORIGIN/"
            code=$(curl -fsS -o /dev/null -w "%{http_code}" "$WEB_ORIGIN/" || true)
            echo "HTTP $code"
            case "$code" in
              200|301|302) ;;
              *) echo "Unexpected status"; exit 1 ;;
            esac
          else
            echo "PUBLIC_WEB_ORIGIN unset — skip web smoke"
          fi
