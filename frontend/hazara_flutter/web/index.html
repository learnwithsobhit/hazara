<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    Flutter web app — base href is replaced at build time.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Primary meta -->
  <meta name="description" content="HAZARA — Four people. One table. Room code. Play Pagat Hazari card game online with friends, no account required.">
  <meta name="theme-color" content="#0C241E">

  <!-- Open Graph / WhatsApp / iMessage (absolute URLs stamped from PUBLIC_WEB_ORIGIN) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="HAZARA">
  <meta property="og:title" content="HAZARA · Play Pagat Hazari">
  <meta property="og:description" content="Four people. One table. Room code. Play Pagat Hazari card game with friends — no account required.">
  <meta property="og:url" content="__WEB_ORIGIN__/">
  <meta property="og:image" content="__WEB_ORIGIN__/icons/og-image.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="HAZARA · Play Pagat Hazari">
  <meta name="twitter:description" content="Four people. One table. Room code.">
  <meta name="twitter:image" content="__WEB_ORIGIN__/icons/og-image.png">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="HAZARA">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png">

  <title>HAZARA</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #0C241E;
      font-family: Georgia, serif;
    }

    /* Branded splash screen shown while Flutter loads */
    #hazara-splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0C241E;
      gap: 12px;
      transition: opacity 0.4s ease;
    }
    #hazara-splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }
    #hazara-splash .wordmark {
      color: #E6C36A;
      font-size: 36px;
      letter-spacing: 8px;
      font-weight: 900;
    }
    #hazara-splash .suits {
      color: #E6C36A;
      font-size: 22px;
      letter-spacing: 4px;
      opacity: 0.8;
    }
    #hazara-splash .loading-bar {
      width: 120px;
      height: 3px;
      background: #1E4E41;
      border-radius: 2px;
      margin-top: 8px;
      overflow: hidden;
    }
    #hazara-splash .loading-bar-fill {
      height: 100%;
      background: #E6C36A;
      border-radius: 2px;
      animation: grow 1.8s ease-in-out infinite;
      transform-origin: left;
    }
    @keyframes grow {
      0%   { width: 0%; }
      60%  { width: 90%; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>
  <!-- Branded splash: visible while Flutter initialises -->
  <div id="hazara-splash">
    <div class="wordmark">HAZARA</div>
    <div class="suits">♣ ♦ ♥ ♠</div>
    <div class="loading-bar"><div class="loading-bar-fill"></div></div>
  </div>

  <script src="flutter_bootstrap.js?v=BUILD_ID" async></script>

  <script>
    function hideHazaraSplash() {
      const splash = document.getElementById('hazara-splash');
      if (!splash || splash.dataset.gone) return;
      splash.dataset.gone = '1';
      splash.classList.add('fade-out');
      splash.addEventListener('transitionend', () => splash.remove(), { once: true });
    }

    // Remove the splash once Flutter has mounted the first frame.
    window.addEventListener('flutter-first-frame', hideHazaraSplash);

    // Debug DDC can sit on this screen for minutes. Say so instead of spinning forever.
    window.setTimeout(() => {
      const splash = document.getElementById('hazara-splash');
      if (!splash || splash.dataset.gone) return;
      const note = document.createElement('div');
      note.style.cssText = 'color:#D7E6DE;font-size:13px;max-width:280px;text-align:center;margin-top:12px;line-height:1.4';
      note.textContent = 'Still loading the table… a debug web-server can take a minute. Hard-refresh, or run flutter run -d web-server --release.';
      splash.appendChild(note);
    }, 8000);
  </script>
</body>
</html>
