<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0C241E"/>

  <!-- Centre felt panel -->
  <rect x="60" y="60" width="1080" height="510" rx="24" fill="#14382F"/>

  <!-- Gold border line on panel -->
  <rect x="60" y="60" width="1080" height="510" rx="24" fill="none" stroke="#E6C36A" stroke-width="3"/>

  <!-- HAZARA wordmark -->
  <text
    x="600" y="270"
    text-anchor="middle"
    font-family="Georgia, serif"
    font-size="120"
    font-weight="900"
    letter-spacing="20"
    fill="#E6C36A">HAZARA</text>

  <!-- Suit row -->
  <text
    x="600" y="350"
    text-anchor="middle"
    font-family="Georgia, serif"
    font-size="48"
    letter-spacing="16"
    fill="#E6C36A"
    opacity="0.85">c  f  e  `</text>

  <!-- Tagline -->
  <text
    x="600" y="420"
    text-anchor="middle"
    font-family="Georgia, serif"
    font-size="28"
    fill="#D7E6DE"
    opacity="0.8">Four people. One table. Room code.</text>

  <!-- Sub-tagline -->
  <text
    x="600" y="458"
    text-anchor="middle"
    font-family="Georgia, serif"
    font-size="20"
    fill="#D7E6DE"
    opacity="0.55">Pagat Hazari · Bangladesh rules · No account required</text>
</svg>
