# Railway config-as-code for hazara-server.
# Dashboard: connect this repo, set env from deployment/railway.env.example.
# One replica: each match is owned by one process. Postgres is shared storage,
# not a second writer.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
numReplicas = 1
healthcheckPath = "/healthz"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
