[package]
name = "hazara-server"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
axum = { version = "0.7", features = ["ws"] }
async-trait = "0.1"
hazara-domain = { path = "../hazara-domain" }
hazara-engine = { path = "../hazara-engine" }
hazara-persistence = { path = "../hazara-persistence" }
hazara-protocol = { path = "../hazara-protocol" }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "fs", "signal"] }
tower-http = { version = "0.6", features = ["cors", "request-id", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4", "serde"] }

[lib]
name = "hazara_server"
path = "src/lib.rs"

[[bin]]
name = "hazara-server"
path = "src/main.rs"

[dev-dependencies]
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = "0.24"


